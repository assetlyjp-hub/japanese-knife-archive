<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 包丁のアイコン: 刃と柄をシンプルに表現 -->
  <defs>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0E0E0"/>
      <stop offset="100%" stop-color="#A0A0A0"/>
    </linearGradient>
  </defs>
  <!-- 刃（ブレード） -->
  <path d="M6 4 L26 24 L28 22 L10 2 Z" fill="url(#blade)" stroke="#666" stroke-width="0.5"/>
  <!-- 柄（ハンドル） -->
  <rect x="2" y="24" width="8" height="4" rx="1" fill="#C5A572" transform="rotate(-45, 6, 26)"/>
  <!-- 峰のハイライト -->
  <line x1="7" y1="3" x2="27" y2="23" stroke="#FFF" stroke-width="0.5" opacity="0.4"/>
</svg>
